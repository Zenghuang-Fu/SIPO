tools:
  call_limit: 3
  max_workers: 64
  timeout: 120
  retry_count: 3
  verbose_logging: true
  fail_on_error: false
  tool_instances:
    python:
      class_path: verl.workers.rollout.tools.python_tool.PythonTool
      params:
        conda_path: /path/to/conda
        conda_env: verl
    search:
      class_path: verl.workers.rollout.tools.search_tool.LocalSearchTool
      params:
        max_results: 10
        result_length: 1000
